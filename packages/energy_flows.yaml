          {% endif %}
        attributes:
          last_power: &grid_last_power_bike >-
            {% set p_id = 'sensor.zigbeesensor_power' %}
            {{ states(p_id) | float(0) if has_value(p_id) else this.attributes.last_power | default(0) }}

      - name: "Motorbike charger energy daily"
        unique_id: energy_motorbike_charger_energy_daily
        unit_of_measurement: kWh
        device_class: energy
        state_class: total
        state: >-

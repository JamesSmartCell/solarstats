          {% set day = now().strftime('%Y-%m-%d') %}
          {% set prev_day = this.attributes.day | default('') %}
          {% set prev = this.state | float(0) if this.state not in ['unknown', 'unavailable'] else 0 %}
          {% if trigger.platform != 'time_pattern' %}

          {% set prev = this.state | float(0) if this.state not in ['unknown', 'unavailable'] else 0 %}
          {% if trigger.platform == 'time_pattern' %}
            {{ (prev + p / 60000) | round(6) }}
          {% else %}
            {{ prev }}
          {% endif %}
        attributes:
          last_power: &grid_last_power_front >-
            {% set p_id = 'sensor.smart_socket_power' %}
            {{ states(p_id) | float(0) if has_value(p_id) else this.attributes.last_power | default(0) }}

      - name: "Front Room PC synth energy daily"
        unique_id: energy_front_room_pc_synth_energy_daily
        unit_of_measurement: kWh
        device_class: energy
        state_class: total
        state: >-
          {% set p_id = 'sensor.smart_socket_power' %}
          {% set p = states(p_id) | float(0) if has_value(p_id) else this.attributes.last_power | float(0) %}
          {% set day = now().strftime('%Y-%m-%d') %}
          {% set prev_day = this.attributes.day | default('') %}
          {% set prev = this.state | float(0) if this.state not in ['unknown', 'unavailable'] else 0 %}
          {% if trigger.platform != 'time_pattern' %}
            {{ prev if prev_day == day else 0 }}
          {% elif prev_day != day %}
            {{ (p / 60000) | round(6) }}
          {% else %}
            {{ (prev + p / 60000) | round(6) }}
          {% endif %}
        attributes:
          day: "{{ now().strftime('%Y-%m-%d') }}"
          last_power: *grid_last_power_front

      - name: "Pi5 Server energy from power"
        unique_id: energy_pi5_server_energy_from_power
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        state: >-
          {% set p_id = 'sensor.ts011f_power' %}
          {% set p = states(p_id) | float(0) if has_value(p_id) else this.attributes.last_power | float(0) %}
          {% set prev = this.state | float(0) if this.state not in ['unknown', 'unavailable'] else 0 %}
          {% if trigger.platform == 'time_pattern' %}
            {{ (prev + p / 60000) | round(6) }}
          {% else %}
            {{ prev }}
          {% endif %}
        attributes:
          last_power: &grid_last_power_pi5 >-
            {% set p_id = 'sensor.ts011f_power' %}
            {{ states(p_id) | float(0) if has_value(p_id) else this.attributes.last_power | default(0) }}

      - name: "Pi5 Server energy daily"
        unique_id: energy_pi5_server_energy_daily
        unit_of_measurement: kWh
        device_class: energy
        state_class: total
        state: >-
          {% set p_id = 'sensor.ts011f_power' %}

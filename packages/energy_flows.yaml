  # Snapshot end-of-day totals just before midnight wipe/reset.
  - trigger:
      - platform: time
        at: "23:59:50"
    sensor:
      - name: "Energy daily snapshot"
        unique_id: energy_daily_snapshot
        state: "{{ now().strftime('%Y-%m-%d') }}"
        icon: mdi:calendar-today
        attributes:
          office_pc_kwh: >-
            {{ states('sensor.office_pc_synth_energy_daily') | float(0) | round(3) }}
          front_room_pc_kwh: >-
            {{ states('sensor.front_room_pc_synth_energy_daily') | float(0) | round(3) }}
          pi5_server_kwh: >-
            {{ states('sensor.pi5_server_energy_daily') | float(0) | round(3) }}
          fridge_kwh: >-
            {{ states('sensor.fridge_energy_daily') | float(0) | round(3) }}
          washing_machine_kwh: >-
            {{ states('sensor.inverter_loads_energy_daily') | float(0) | round(3) }}
          inverter_other_kwh: >-
            {{ states('sensor.inverter_unmetered_energy_daily') | float(0) | round(3) }}
          captured_at: "{{ now().isoformat() }}"

      - name: "Office PC energy yesterday"

          {% else %}
            {{ (prev + p / 60000) | round(6) }}
          {% endif %}
        attributes:
          day: "{{ now().strftime('%Y-%m-%d') }}"
          last_power: *grid_last_power_pi5

      - name: "Motorbike charger energy from power"
        unique_id: energy_motorbike_charger_energy_from_power
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        state: >-

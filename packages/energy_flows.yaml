      - name: "Inverter other energy yesterday"
        unique_id: energy_inverter_other_energy_yesterday
        unit_of_measurement: kWh
        device_class: energy
        state: "{{ states('sensor.inverter_unmetered_energy_daily') | float(0) | round(3) }}"
        attributes:

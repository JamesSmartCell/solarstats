# Energy flow helpers for Home Assistant
#
# Include from configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
#
# Then restart HA. Wire Energy dashboard in UI:
#   Solar production → sensor.solar_production_energy_daily (or the raw integral)
#   Individual devices → the *_energy sensors below (optional)
#
# Power sensors only → this package integrates W → kWh, then daily utility meters.

# ---------------------------------------------------------------------------
# Instantaneous power (W) + latched washer energy (survives washer offline)
# ---------------------------------------------------------------------------
template:
  # Hold last good lifetime kWh while washer energy is unavailable/unknown.
  - trigger:
      - platform: state
        entity_id: sensor.laundry_room_washer_energy
        not_to:
          - unavailable
          - unknown
    sensor:
      - name: "Laundry room washer energy latched"
        unique_id: energy_washer_energy_latched
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        state: "{{ trigger.to_state.state | float(0) }}"

  # Re-check every minute so a stuck Modbus last-value ages out after 10 min.
  - trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: state
        entity_id:
          - sensor.garden_powmr_inverter_pv_power
          - sensor.garden_powmr_inverter_output_power
      - platform: homeassistant
        event: start
      - platform: event
        event_type: event_template_reloaded
    sensor:
      - name: "Solar production power"
        unique_id: energy_solar_production_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >-
          {% set s = 'sensor.garden_powmr_inverter_pv_power' %}
          {% if has_value(s) and (now() - states[s].last_updated).total_seconds() < 600 %}
            {{ states(s) | float(0) }}
          {% else %}
            0
          {% endif %}

      - name: "Inverter supply power"
        unique_id: energy_inverter_supply_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >-
          {% set s = 'sensor.garden_powmr_inverter_output_power' %}
          {% if has_value(s) and (now() - states[s].last_updated).total_seconds() < 600 %}
            {{ states(s) | float(0) }}
          {% else %}
            0
          {% endif %}

  # Washer W ≈ d(kWh)/dt (derivative is kW → ×1000).
  # Re-check every minute so a stuck rate ages out after 20 min with no energy change.
  # Also force 0 when Machine state is Stopped or energy sensor is offline.
  - trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: state
        entity_id:
          - sensor.laundry_room_washer_energy
          - sensor.laundry_room_washer_power_derived
          - sensor.laundry_room_washer_machine_state
      - platform: homeassistant
        event: start
      - platform: event
        event_type: event_template_reloaded
    sensor:
      - name: "Laundry room washer power approx"
        unique_id: energy_washer_power_approx
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >-
          {% set src = 'sensor.laundry_room_washer_power_derived' %}
          {% set energy = 'sensor.laundry_room_washer_energy' %}
          {% set mstate = 'sensor.laundry_room_washer_machine_state' %}
          {% if not has_value(energy) %}
            0
          {% elif has_value(mstate) and states(mstate) == 'Stopped' %}
            0
          {% elif (now() - states[energy].last_changed).total_seconds() >= 1200 %}
            0
          {% elif has_value(src) %}
            {% set w = (states(src) | float(0) * 1000) | round(0) %}
            {{ [[w, 0] | max, 3500] | min }}
          {% else %}
            0
          {% endif %}

  - sensor:
      - name: "Inverter loads power"
        unique_id: energy_inverter_loads_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: "{{ states('sensor.laundry_room_washer_power_approx') | float(0) }}"

      - name: "Inverter unmetered power"
        unique_id: energy_inverter_unmetered_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >-
          {% set supply = states('sensor.inverter_supply_power') | float(0) %}
          {% set metered = states('sensor.inverter_loads_power') | float(0) %}
          {{ [supply - metered, 0] | max }}

      - name: "Grid loads power"
        unique_id: energy_grid_loads_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >-
          {% set ids = [
            'sensor.smart_socket_2_power',
            'sensor.smart_socket_power',
            'sensor.ts011f_power',
            'sensor.zigbeesensor_power',
            'sensor.kitchen_refrigerator_power',
          ] %}
          {% set ns = namespace(t=0) %}
          {% for id in ids %}
            {% if has_value(id) %}
              {% set ns.t = ns.t + (states(id) | float(0)) %}
            {% endif %}
          {% endfor %}
          {{ ns.t }}

      - name: "House metered loads power"
        unique_id: energy_house_metered_loads_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >-
          {{
            states('sensor.grid_loads_power') | float(0)
            + states('sensor.inverter_loads_power') | float(0)
          }}

  # Sample plug power every minute and accumulate kWh (lifetime + today).
  # Tuya/Zigbee often omit updates while watts are flat — HA integrals then freeze.
  # Daily sensors are templates (not utility_meter) so they always exist for ApexCharts.
  - trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: homeassistant
        event: start
      - platform: event
        event_type: event_template_reloaded
    sensor:
      - name: "Office PC energy from power"
        unique_id: energy_office_pc_energy_from_power
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        state: >-
          {% set p_id = 'sensor.smart_socket_2_power' %}
          {% set p = states(p_id) | float(0) if has_value(p_id) else this.attributes.last_power | float(0) %}
          {% set prev = this.state | float(0) if this.state not in ['unknown', 'unavailable'] else 0 %}
          {% if trigger.platform == 'time_pattern' %}
            {{ (prev + p / 60000) | round(6) }}
          {% else %}
            {{ prev }}
          {% endif %}
        attributes:
          last_power: &grid_last_power_office >-
            {% set p_id = 'sensor.smart_socket_2_power' %}
            {{ states(p_id) | float(0) if has_value(p_id) else this.attributes.last_power | default(0) }}

      - name: "Office PC synth energy daily"
        unique_id: energy_office_pc_synth_energy_daily
        unit_of_measurement: kWh
        device_class: energy
        state_class: total
        state: >-
          {% set p_id = 'sensor.smart_socket_2_power' %}
          {% set p = states(p_id) | float(0) if has_value(p_id) else this.attributes.last_power | float(0) %}
          {% set day = now().strftime('%Y-%m-%d') %}
          {% set prev_day = this.attributes.day | default('') %}
          {% set prev = this.state | float(0) if this.state not in ['unknown', 'unavailable'] else 0 %}
          {% if trigger.platform != 'time_pattern' %}
            {{ prev if prev_day == day else 0 }}
          {% elif prev_day != day %}
            {{ (p / 60000) | round(6) }}
          {% else %}
            {{ (prev + p / 60000) | round(6) }}
          {% endif %}
        attributes:
          day: "{{ now().strftime('%Y-%m-%d') }}"
          last_power: *grid_last_power_office

      - name: "Front Room PC energy from power"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create passkey — Solarstats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/solarstats.css" />
    <link rel="stylesheet" href="/auth.css" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <h1 class="brand">Solar<span>stats</span></h1>
      <p class="sub">Create a passkey</p>
      <p class="auth-copy">
        Step 1: verify who you are with Google, Apple, or Microsoft.<br />
        Step 2: save a <strong>device</strong> passkey (iCloud Keychain / Google Password Manager / Windows Hello).
        That is separate from Microsoft Authenticator.
      </p>
      <p class="auth-error" id="errorBox" hidden></p>
      <div id="providerButtons"></div>
      <a class="auth-btn secondary" href="/login">Back to sign in</a>
    </main>
    <script type="module" src="/create-passkey.js"></script>
  </body>
</html>

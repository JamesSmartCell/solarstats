<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — Solarstats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/solarstats.css" />
    <link rel="stylesheet" href="/auth.css" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <h1 class="brand">Solar<span>stats</span></h1>
      <p class="sub">Private dashboard</p>

      <p class="auth-error" id="errorBox" hidden></p>

      <a class="auth-btn microsoft" id="msBtn" href="/auth/microsoft">
        Use MS Authenticator
      </a>
      <p class="auth-hint">
        Microsoft sign-in with Authenticator number matching.
      </p>

      <button type="button" class="auth-btn secondary" id="passkeyBtn">
        Sign in with passkey
      </button>
      <p class="auth-hint" id="passkeyHint" hidden>
        Use a passkey already saved for this site.
      </p>

      <a class="auth-btn secondary" href="/create-passkey">Create passkey</a>
      <p class="auth-hint">
        Email + device passkey (Apple Passwords / Google Password Manager / Windows Hello).
      </p>
    </main>
    <script type="module" src="/login.js"></script>
  </body>
</html>

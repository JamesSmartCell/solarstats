<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Access — Solarstats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/solarstats.css" />
    <link rel="stylesheet" href="/auth.css" />
  </head>
  <body class="auth-body" data-slug="{{SITE_SLUG}}" data-applied="{{APPLIED}}">
    <main class="auth-card">
      <h1 class="brand">Solar<span>stats</span></h1>
      <p class="sub">{{SITE_NAME}}</p>
      <p class="auth-copy">This dashboard has not been shared with you.</p>
      <p class="auth-copy">Signed in as <strong>{{EMAIL}}</strong>.</p>
      <button type="button" class="auth-btn" id="apply">Apply for access</button>
      <p class="auth-status" id="status" hidden></p>
      <form method="post" action="/logout?next=/{{SITE_SLUG}}">
        <button type="submit" class="auth-btn secondary">Sign out</button>
      </form>
    </main>
    <script type="module" src="/access.js"></script>
  </body>
</html>

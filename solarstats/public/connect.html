<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>New connection — Solarstats</title>
    <link rel="stylesheet" href="/solarstats.css" />
    <link rel="stylesheet" href="/auth.css" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <h1 class="brand">Solar<span>stats</span></h1>
      <p class="sub">New connection</p>
      <p class="auth-lead">Type the 5-character code shown in Home Assistant.</p>
      <p class="auth-lead" id="signedInAs">Checking which account is signed in…</p>
      <p class="auth-error" id="errorBox" hidden></p>
      <p class="auth-status" id="statusBox" hidden></p>
      <form id="connectForm">
        <input
          id="code"
          class="auth-btn"
          name="code"
          autocomplete="one-time-code"
          maxlength="5"
          placeholder="CODE"
          style="text-align: center; letter-spacing: 0.35em; font-family: var(--font-mono, monospace); text-transform: uppercase"
          required
        />
        <button class="auth-btn" type="submit">Connect</button>
      </form>
      <form method="post" action="/logout?next=/connect">
        <button class="auth-btn" type="submit">Use a different account</button>
      </form>
    </main>
    <script type="module" src="/connect.js"></script>
  </body>
</html>

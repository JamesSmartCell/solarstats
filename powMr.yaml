substitutions:
  device_name: powmr-inverter
  friendly_name: "PowMr Inverter"
  inverter_tx_pin: GPIO17   # ESP32 TX → SP3232 RXD (TTL)
  inverter_rx_pin: GPIO16   # ESP32 RX ← SP3232 TXD (TTL)
  update_interval: 15s

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev          # change if needed (e.g. esp32-c6-devkitc-1)
  framework:
    type: esp-idf

wifi:
  ssid: <YOUR_WIFI_SSID>
  password: <YOUR_WIFI_PASSWORD>

logger:

api:
ota:
  - platform: esphome

uart:
  - id: uart_inverter
    baud_rate: 2400
    tx_pin: ${inverter_tx_pin}
    rx_pin: ${inverter_rx_pin}

modbus:
  - id: modbus_inverter
    uart_id: uart_inverter
    send_wait_time: 250ms

modbus_controller:
  - id: inverter
    address: 0x05
    modbus_id: modbus_inverter
    update_interval: ${update_interval}
    command_throttle: 1s

# PowMr holding regs start at 4501 (see leodesigner/powmr_comm).
# Words on the wire are little-endian → swap bytes, then apply scale.
# Mapping (addr = 4501 + index):
#   4501 mode, 4502 AC V /10, 4503 AC Hz /10, 4504 PV V /10, 4505 PV W,
#   4506 batt V /10, 4507 batt %, 4508 charge A, 4509 discharge A, b
#   4512 output W, 4513 load % /20

sensor:
  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Grid Voltage"
    address: 4502
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t) x;
          return (float) (uint16_t) ((raw >> 8) | (raw << 8));
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "AC Frequency"
    address: 4503
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t) x;
          return (float) (uint16_t) ((raw >> 8) | (raw << 8));
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "PV Voltage"
    address: 4504
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t) x;
          return (float) (uint16_t) ((raw >> 8) | (raw << 8));
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "PV Power"
    address: 4505
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t) x;
          return (float) (uint16_t) ((raw >> 8) | (raw << 8));

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Battery Voltage"
    address: 4506
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t) x;
          return (float) (uint16_t) ((raw >> 8) | (raw << 8));
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Battery SoC"
    address: 4507
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t) x;
          return (float) (uint16_t) ((raw >> 8) | (raw << 8));

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Battery Charge Current"
    address: 4508
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t) x;
          return (float) (uint16_t) ((raw >> 8) | (raw << 8));

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Battery Discharge Current"
    address: 4509
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t) x;
          return (float) (uint16_t) ((raw >> 8) | (raw << 8));

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Output Power"
    address: 4512
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t) x;
          return (float) (uint16_t) ((raw >> 8) | (raw << 8));

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Load Percent"
    address: 4513
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t) x;
          return (float) (uint16_t) ((raw >> 8) | (raw << 8));
      - multiply: 0.05

substitutions:
  device_name: powmr-inverter
  friendly_name: "PowMr Inverter"
  inverter_tx_pin: GPIO17   # ESP32 TX → SP3232 RXD (TTL)
  inverter_rx_pin: GPIO16   # ESP32 RX ← SP3232 TXD (TTL)
  update_interval: 15s
  # If Modbus goes quiet (charge-only / inverter off), clear power to 0 after this.
  power_stale_timeout: "10min"
  # Sanity caps — out-of-range Modbus glitches are dropped (keep last good value).
  max_inverter_power_w: "3500"
  max_pv_power_w: "2000"
  max_grid_voltage_v: "300"
  max_pv_voltage_v: "2000"
  max_battery_voltage_v: "70"
  max_battery_current_a: "200"
  max_ac_frequency_hz: "70"
  min_ac_frequency_hz: "40"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

api:
ota:
  - platform: esphome
    password: !secret powmr_inverter__ota_password

uart:
  - id: uart_inverter
    baud_rate: 2400
    tx_pin: ${inverter_tx_pin}
    rx_pin: ${inverter_rx_pin}

modbus:
  - id: modbus_inverter
    uart_id: uart_inverter
    send_wait_time: 250ms

modbus_controller:
  - id: inverter
    address: 0x05
    modbus_id: modbus_inverter
    update_interval: ${update_interval}
    command_throttle: 1s

# PowMr holding regs start at 4501 (see leodesigner/powmr_comm).
# Words on the wire are little-endian → swap bytes, then apply scale.
# Mapping (addr = 4501 + index):
#   4501 mode, 4502 AC V /10, 4503 AC Hz /10, 4504 PV V /10, 4505 PV W,
#   4506 batt V /10, 4507 batt %, 4508 charge A, 4509 discharge A, b
#   4512 output W, 4513 load % /20

sensor:
  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Grid Voltage"
    address: 4502
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t) x;
          return (float) (uint16_t) ((raw >> 8) | (raw << 8));
      - multiply: 0.1
      - lambda: |-
          if (isnan(x) || x < 0.0f || x > ${max_grid_voltage_v}) return {};
          return x;

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "AC Frequency"
    address: 4503
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t) x;
          return (float) (uint16_t) ((raw >> 8) | (raw << 8));
      - multiply: 0.1
      - lambda: |-
          if (isnan(x) || x < ${min_ac_frequency_hz} || x > ${max_ac_frequency_hz}) return {};
          return x;

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "PV Voltage"
    address: 4504
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t) x;
          return (float) (uint16_t) ((raw >> 8) | (raw << 8));
      - multiply: 0.1
      - lambda: |-
          if (isnan(x) || x < 0.0f || x > ${max_pv_voltage_v}) return {};
          return x;

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "PV Power"
    address: 4505
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t) x;
          return (float) (uint16_t) ((raw >> 8) | (raw << 8));
      - lambda: |-
          if (isnan(x) || x < 0.0f || x > ${max_pv_power_w}) return {};
          return x;
      # No successful publish (e.g. inverter/Modbus quiet) → 0 W, not last stuck value.
      - timeout:
          timeout: ${power_stale_timeout}
          value: 0

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Battery Voltage"
    address: 4506
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t) x;
          return (float) (uint16_t) ((raw >> 8) | (raw << 8));
      - multiply: 0.1
      - lambda: |-
          if (isnan(x) || x < 0.0f || x > ${max_battery_voltage_v}) return {};
          return x;

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Battery SoC"
    address: 4507
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t) x;
          return (float) (uint16_t) ((raw >> 8) | (raw << 8));
      - lambda: |-
          if (isnan(x) || x < 0.0f || x > 100.0f) return {};
          return x;

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Battery Charge Current"
    address: 4508
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t) x;
          return (float) (uint16_t) ((raw >> 8) | (raw << 8));
      - lambda: |-
          if (isnan(x) || x < 0.0f || x > ${max_battery_current_a}) return {};
          return x;

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Battery Discharge Current"
    address: 4509
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t) x;
          return (float) (uint16_t) ((raw >> 8) | (raw << 8));
      - lambda: |-
          if (isnan(x) || x < 0.0f || x > ${max_battery_current_a}) return {};
          return x;

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Output Power"
    address: 4512
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t) x;
          return (float) (uint16_t) ((raw >> 8) | (raw << 8));
      - lambda: |-
          if (isnan(x) || x < 0.0f || x > ${max_inverter_power_w}) return {};
          return x;
      - timeout:
          timeout: ${power_stale_timeout}
          value: 0

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Load Percent"
    address: 4513
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: |-
          uint16_t raw = (uint16_t) x;
          return (float) (uint16_t) ((raw >> 8) | (raw << 8));
      - multiply: 0.05
      - lambda: |-
          if (isnan(x) || x < 0.0f || x > 150.0f) return {};
          return x;

select:
  - platform: modbus_controller
    modbus_controller_id: inverter
    id: output_source_priority
    name: "Output Source Priority"
    address: 5018
    value_type: U_WORD
    optionsmap:
      "Bypass/Standby": 0
      "SBU (Solar-Battery-Utility)": 1
      "Utility First": 2

    # The byte-swapping isn't needed for writing, but if the dropdown shows the wrong current value, add:
    # filters:
    #   - lambda: |-
    #       uint16_t raw = (uint16_t) x;
    #       return (float) (uint16_t) ((raw >> 8) | (raw << 8));
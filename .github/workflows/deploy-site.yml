name: Deploy Solarstats Dashboard (Web Server)

on:
  push:
    branches:
      - master
    paths:
      - 'solarstats/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

# Prevent concurrent deploys to avoid conflicts
concurrency:
  group: solarstats-site-deploy
  cancel-in-progress: false

env:
  # Path where the dashboard service runs (WorkingDirectory from homesolar.service)
  # This is the solarstats/ subfolder; git root is /home/james/dev/solarstats
  # Runner must run as user 'james'
  # ⚠️ IMPORTANT: Confirm this path matches your systemd service WorkingDirectory
  DEPLOY_PATH: /home/james/dev/solarstats/solarstats

jobs:
  deploy:
    name: Deploy Dashboard to Linode
    runs-on: [self-hosted, solarstats-site]
    
    # Only deploy from the main repository to prevent forks from deploying
    if: github.repository == 'JamesSmartCell/solarstats'
    
    steps:
      - name: Verify deployment directory
        run: |
          if [ ! -d "$DEPLOY_PATH" ]; then
            echo "❌ Deployment directory does not exist: $DEPLOY_PATH"
            exit 1
          fi
          
          if ! git -C "$DEPLOY_PATH" rev-parse --is-inside-work-tree > /dev/null 2>&1; then
            echo "❌ Not inside a git working tree: $DEPLOY_PATH"
            exit 1
          fi
          
          echo "✅ Deployment directory exists: $DEPLOY_PATH"
      
      - name: Update code from origin
        run: |
          cd "$DEPLOY_PATH"
          
          echo "Current directory: $(pwd)"
          echo "Current commit: $(git rev-parse --short HEAD)"
          
          # Fetch latest changes
          git fetch origin
          
          # Reset to origin/master (preserves .env and data/ as they're not tracked)
          git reset --hard origin/master
          
          echo "Updated to commit: $(git rev-parse --short HEAD)"
          echo "Branch: $(git rev-parse --abbrev-ref HEAD)"
      
      - name: Install production dependencies
        run: |
          cd "$DEPLOY_PATH"
          npm ci --omit=dev
        env:
          NODE_ENV: production
      
      - name: Restart homesolar service
        run: |
          echo "Restarting homesolar.service..."
          sudo systemctl restart homesolar
      
      - name: Check service status
        run: |
          sudo systemctl is-active --quiet homesolar || (
            echo "❌ Service failed to start. Checking logs:"
            sudo journalctl -u homesolar -n 50 --no-pager
            exit 1
          )
          
          echo "✅ Service is running"
          sudo systemctl status homesolar --no-pager -l
      
      - name: Health check
        run: |
          echo "Waiting for service to be ready..."
          
          # Wait up to 90 seconds for the service to respond
          # (First startup after deploy may take longer due to VACUUM or large prune)
          for i in {1..90}; do
            if curl -f -s http://localhost:8787/api/health > /dev/null; then
              echo "✅ Health check passed after $i seconds"
              curl -s http://localhost:8787/api/health | jq .
              exit 0
            fi
            echo "Attempt $i/90 - Service not ready yet..."
            sleep 1
          done
          
          echo "❌ Health check failed after 90 seconds"
          echo "Service logs:"
          sudo journalctl -u homesolar -n 100 --no-pager
          exit 1
      
      - name: Deployment summary
        if: success()
        run: |
          cd "$DEPLOY_PATH"
          echo "🚀 Deployment successful!"
          echo "Deployed to: $DEPLOY_PATH"
          echo "Commit: $(git rev-parse --short HEAD) ($(git log -1 --pretty=%B | head -1))"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Dashboard: https://homesolar.percolate.one/"
